services:
  - type: web
    name: exit-link-api
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn exit_link.public_app:app --host 0.0.0.0 --port $PORT --workers 1 --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: EXIT_LINK_PUBLIC_ORIGIN
        sync: false
