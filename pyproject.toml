[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "exit-link"
version = "0.1.0"
description = "Synthetic disaster communication topology foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.152,<1",
    "uvicorn[standard]>=0.30,<1",
    "networkx>=3.4,<4",
    "pydantic>=2.9,<3",
    "apsw==3.54.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.15,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exit_link = ["data/simulation/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
